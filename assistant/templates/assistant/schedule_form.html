{% extends 'assistant/base.html' %}

{% block title %}Schedule Automated AI Call - EchoCall AI{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto glass-card rounded-3xl p-6 border border-indigo-500/30 shadow-2xl">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
        <div>
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-regular fa-clock text-indigo-400"></i> Schedule Automated AI Call
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">Set a countdown timer to trigger an automated phone call to your mobile</p>
        </div>
        <a href="{% url 'dashboard' %}" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></a>
    </div>

    <form method="POST" class="space-y-4 text-xs">
        {% csrf_token %}

        <div>
            <label class="block font-semibold text-slate-300 mb-1">Select Campaign Scenario</label>
            <select name="scenario_id" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white cursor-pointer">
                {% for sc in scenarios %}
                    <option value="{{ sc.id }}">{{ sc.title }} ({{ sc.category }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block font-semibold text-slate-300 mb-1">Target Mobile Phone Number</label>
            <input type="text" name="phone_number" required value="+1 (555) 234-8901" placeholder="+1 (555) 000-0000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono">
        </div>

        <div>
            <label class="block font-semibold text-slate-300 mb-1">Countdown Delay</label>
            <select name="delay_seconds" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white font-mono">
                <option value="15">15 Seconds (Quick Demo)</option>
                <option value="30">30 Seconds</option>
                <option value="60">1 Minute</option>
                <option value="300">5 Minutes</option>
                <option value="600">10 Minutes</option>
            </select>
        </div>

        <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3">
            <a href="{% url 'dashboard' %}" class="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-semibold">Cancel</a>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-lg shadow-indigo-600/20">
                <i class="fa-regular fa-clock me-1"></i> Add Scheduled Call
            </button>
        </div>
    </form>
</div>
{% endblock %}
